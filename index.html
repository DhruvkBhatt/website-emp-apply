<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14100F" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- §9: deliberately vague. Assume link previews are seen by anyone. -->
    <title>Application Portal</title>
    <meta name="description" content="A private application portal." />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:title" content="Application Portal" />
    <meta property="og:description" content="Status: submitted. Awaiting review." />
    <meta property="og:image" content="./og-image.png" />
    <meta property="og:type" content="website" />

    <!--
      §3: self-hosted WOFF2 subsets, no Google Fonts request on first paint.
      The binaries are not in the repo yet — run `npm run fonts` (see
      public/fonts/README.md), then uncomment these two lines. Until then the
      fallback stack (Georgia / system-ui / ui-monospace) is used, and the
      preloads stay commented so the console stays clean.

      <link rel="preload" href="./fonts/cormorant-garamond-600.woff2" as="font" type="font/woff2" crossorigin />
      <link rel="preload" href="./fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin />
    -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: Georgia, serif; background: #14100f; color: #d9be8a">
        <h1>Application Portal</h1>
        <p>
          This application requires JavaScript. If you are reading this, please tell the candidate —
          he will consider it a P0 and fix it immediately.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
