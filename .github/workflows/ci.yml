name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # §5.6 — the privacy gate runs in CI too, so `--no-verify` on a local
      # commit still gets caught before merge.
      - name: Privacy gate
        run: npm run privacy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      # §7 — the performance budget is a gate, not a suggestion.
      - name: Performance budget
        run: npm run budget
